[agent]
  interval = "10s"
[[inputs.cpu]]
[[inputs.mem]]
[[inputs.http]]
  urls = ["http://host.docker.internal:5000/metrics"]
  data_format = "json"
  name_override = "nexus_api"
# Windows hosts: enable PerfMon counters
# [[inputs.win_perf_counters]]
#   [[inputs.win_perf_counters.object]]
#     ObjectName = "Processor"
#     Counters = ["% Processor Time"]
#     Instances = ["_Total"]
#     Measurement = "win_cpu"
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "nexus"
