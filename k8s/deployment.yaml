apiVersion: apps/v1
kind: Deployment
metadata: {name: nexus-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: nexus-api}}
  template:
    metadata: {labels: {app: nexus-api}}
    spec:
      containers:
      - name: api
        image: <acr>.azurecr.io/nexus-api:latest
        ports: [{containerPort: 8080}]
        envFrom: [{secretRef: {name: nexus-secrets}}]
        resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
        livenessProbe: {httpGet: {path: /health/live, port: 8080}}
        readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: nexus-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: nexus-api}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
# Processor scales with Kafka consumer lag (KEDA) up to partition count
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: nexus-processor}
spec:
  scaleTargetRef: {name: nexus-processor}
  maxReplicaCount: 6
  triggers: [{type: kafka, metadata: {bootstrapServers: kafka:9092, consumerGroup: nexus-processor, topic: sc.events, lagThreshold: "500"}}]
